# .github/workflows/deploy.yml
name: CI/CD to EC2

on:
  push:
    branches:
      - main
      - qa

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v3

    - name: Loguear en Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Construir imagen y subir a Docker Hub
      run: |
        docker build -t arieling/ms-rbac .
        docker push arieling/ms-rbac

    - name: Acceder a EC2 y desplegar contenedor
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          echo "${{ secrets.ENV_FILE }}" > .env
          docker pull arieling/ms-rbac
          docker stop ms-rbac || true
          docker rm ms-rbacs || true
          docker run -d --name ms-rbac -p 4005:4005 --env-file .env arieling/ms-rbac
